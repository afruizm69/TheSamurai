name: Build THE SAMURAI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: THE-SAMURAI-${{ runner.os }}
          path: |
            build/TheSamurai_artefacts/Release/VST3
            build/TheSamurai_artefacts/Release/AU
            build/TheSamurai_artefacts/Release/Standalone
          if-no-files-found: warn

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "installer\TheSamurai.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: THE-SAMURAI-Setup-Windows
          path: build/installer/*.exe
